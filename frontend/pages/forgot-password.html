<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Forgot Password | DADDY TOSS BOOK</title>
  <meta name="description" content="Recover your DADDY TOSS BOOK account password safely.">

  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Core Design System CSS -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">

  <!-- Authentication CSS -->
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body data-page="auth-forgot">
  <div class="auth-wrapper">
    <div class="auth-container">
      
      <!-- Brand Logo / Identity Header -->
      <a href="../index.html" class="auth-brand" aria-label="DADDY TOSS BOOK - Return to Home">
        <div class="auth-brand-badge">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"></path>
          </svg>
        </div>
        <span class="auth-brand-title">DADDY</span>
        <span class="auth-brand-subtitle">TOSS BOOK</span>
      </a>

      <!-- Forgot Password Card -->
      <main class="auth-card" id="forgot-card">
        <header class="auth-card-header">
          <h1 class="auth-title">Forgot Password?</h1>
          <p class="auth-subtitle">Enter your registered email address to receive password reset instructions.</p>
        </header>

        <!-- Development Notice / Honest Boundary Banner -->
        <div id="forgot-dev-alert" class="auth-alert auth-alert-dev" role="status" aria-live="polite"></div>

        <!-- Forgot Form -->
        <form class="auth-form" id="forgot-form" novalidate>
          
          <!-- Email Input -->
          <div class="form-group">
            <label for="forgot-email" class="form-label">Registered Email Address</label>
            <input 
              type="email" 
              id="forgot-email" 
              name="email" 
              class="form-control" 
              placeholder="e.g. user@example.com"
              autocomplete="email"
              inputmode="email"
              required
              aria-describedby="email-error"
            />
            <div id="email-error" class="field-error" role="alert"></div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary btn-block" id="forgot-submit-btn" style="margin-top: var(--space-xs);">
            <span class="btn-spinner" aria-hidden="true"></span>
            <span class="btn-text">Send Reset Instructions</span>
          </button>
        </form>

        <!-- Card Footer Links -->
        <footer class="auth-card-footer">
          <p>
            Remembered your password? 
            <a href="login.html">Back to Sign In</a>
          </p>
        </footer>
      </main>

      <!-- Return to Home Link -->
      <div class="auth-back-home">
        <a href="../index.html">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Back to Home
        </a>
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/auth/validation.js"></script>
  <script src="../js/auth/forgot-password.js"></script>
</body>
</html>
