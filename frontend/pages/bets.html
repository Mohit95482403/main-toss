<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>My Bets | IRONMAN TOSS BOOK</title>
  <meta name="description" content="View your live, won, lost, and settled toss betting history on IRONMAN TOSS BOOK.">

  <!-- Core Design System CSS -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">

  <!-- Shared Layout Component CSS -->
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/announcement-ticker.css">
  <link rel="stylesheet" href="../css/bottom-navigation.css">

  <!-- Bets Page CSS (Day 4) -->
  <link rel="stylesheet" href="../css/bets.css">
</head>
<body data-page="bets" data-in-pages="true">
  <div class="app-wrapper">
    <main class="app-container" id="app-root">
      
      <!-- Shared Header Mounting Container -->
      <div id="shared-header"></div>

      <!-- Shared Announcement Ticker Mounting Container -->
      <div id="shared-ticker"></div>

      <!-- Bets Page Content Area -->
      <div class="main-content">
        
        <!-- Page Title & Metric Row -->
        <header class="bets-header-section">
          <div class="bets-page-title-row">
            <h1 class="bets-page-title">My Bets</h1>
            <span class="bets-total-count" id="total-bets-count">6 Total Bets</span>
          </div>
          <p class="text-sm text-muted">Track your live toss wagers, win/loss rates, and settlement records.</p>
        </header>

        <!-- Status Filter Segmented Navigation Strip -->
        <nav class="bets-filter-strip" aria-label="Filter Bets by Status" role="region">
          <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">
            All <span class="filter-count">6</span>
          </button>
          <button type="button" class="filter-btn" data-filter="live" aria-pressed="false">
            Live <span class="filter-count">1</span>
          </button>
          <button type="button" class="filter-btn" data-filter="won" aria-pressed="false">
            Won <span class="filter-count">2</span>
          </button>
          <button type="button" class="filter-btn" data-filter="lost" aria-pressed="false">
            Lost <span class="filter-count">2</span>
          </button>
          <button type="button" class="filter-btn" data-filter="no_result" aria-pressed="false">
            No Result <span class="filter-count">1</span>
          </button>
        </nav>

        <!-- Dynamic Date-Grouped Bet Cards Feed -->
        <div id="bets-feed-container" class="bets-feed-container" aria-live="polite">
          <!-- Populated dynamically via bets.js -->
        </div>

      </div>

      <!-- Bottom Spacer to prevent navigation overlap -->
      <div class="bottom-nav-spacer" aria-hidden="true"></div>

      <!-- Shared Bottom Navigation Mounting Container -->
      <div id="shared-bottom-nav"></div>

    </main>
  </div>

  <!-- Application Logic Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/shared-layout.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/bets.js"></script>
</body>
</html>
