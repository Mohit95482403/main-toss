<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Sign In | DADDY TOSS BOOK</title>
  <meta name="description" content="Sign in to your DADDY TOSS BOOK account to access live match toss betting and real-time ledger.">

  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Core Design System CSS -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">

  <!-- Authentication CSS -->
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body data-page="auth-login">
  <div class="auth-wrapper">
    <div class="auth-container">
      
      <!-- Brand Logo / Identity Header -->
      <a href="../index.html" class="auth-brand" aria-label="DADDY TOSS BOOK - Return to Home">
        <div class="auth-brand-badge">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"></path>
          </svg>
        </div>
        <span class="auth-brand-title">DADDY</span>
        <span class="auth-brand-subtitle">TOSS BOOK</span>
      </a>

      <!-- Authentication Card -->
      <main class="auth-card" id="login-card">
        <header class="auth-card-header">
          <h1 class="auth-title">Welcome Back</h1>
          <p class="auth-subtitle">Sign in to manage your bets, passbook, and account profile.</p>
        </header>

        <!-- Development Notice / Honest Boundary Banner -->
        <div id="login-dev-alert" class="auth-alert auth-alert-dev" role="status" aria-live="polite"></div>
        <div id="login-error-alert" class="auth-alert auth-alert-error" role="alert" aria-live="assertive"></div>

        <!-- Login Form -->
        <form class="auth-form" id="login-form" novalidate>
          
          <!-- Identifier Input (Email or Username) -->
          <div class="form-group">
            <label for="login-identifier" class="form-label">Email Address or Username</label>
            <input 
              type="text" 
              id="login-identifier" 
              name="identifier" 
              class="form-control" 
              placeholder="e.g. user@example.com or daddy99"
              autocomplete="username"
              required
              aria-describedby="identifier-error"
            />
            <div id="identifier-error" class="field-error" role="alert"></div>
          </div>

          <!-- Password Input with Visibility Toggle -->
          <div class="form-group">
            <div class="flex items-center justify-between">
              <label for="login-password" class="form-label">Password</label>
              <a href="forgot-password.html" class="text-sm" tabindex="0">Forgot Password?</a>
            </div>
            <div class="input-wrapper">
              <input 
                type="password" 
                id="login-password" 
                name="password" 
                class="form-control" 
                placeholder="Enter your password"
                autocomplete="current-password"
                required
                aria-describedby="password-error"
              />
              <button 
                type="button" 
                id="password-toggle-btn" 
                class="password-toggle-btn" 
                title="Show password in plain text">
              </button>
            </div>
            <div id="password-error" class="field-error" role="alert"></div>
          </div>

          <!-- Remember Me Checkbox -->
          <div class="auth-links-row" style="margin-top: var(--space-2xs);">
            <label class="checkbox-group">
              <input type="checkbox" id="login-remember" name="remember" />
              <span>Remember me on this device</span>
            </label>
          </div>

          <!-- Primary Submit Button -->
          <button type="submit" class="btn btn-primary btn-block" id="login-submit-btn" style="margin-top: var(--space-xs);">
            <span class="btn-spinner" aria-hidden="true"></span>
            <span class="btn-text">Sign In</span>
          </button>
        </form>

        <!-- Card Footer Links -->
        <footer class="auth-card-footer">
          <p class="auth-restricted-notice" style="font-size: var(--font-size-xs); color: var(--color-text-muted); line-height: 1.5; margin: 0;">
            Account registration is currently restricted.<br>
            Please contact the administrator to obtain an account.
          </p>
        </footer>
      </main>

      <!-- Return to Home Link -->
      <div class="auth-back-home">
        <a href="../index.html">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Back to Home
        </a>
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/api-client.js"></script>
  <script src="../js/auth/validation.js"></script>
  <script src="../js/auth/login.js"></script>
</body>
</html>
