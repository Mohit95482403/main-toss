<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Reset Password | IRONMAN TOSS BOOK</title>
  <meta name="description" content="Set a new secure password for your IRONMAN TOSS BOOK account.">

  <!-- Core Design System CSS -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">

  <!-- Authentication CSS -->
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body data-page="auth-reset">
  <div class="auth-wrapper">
    <div class="auth-container">
      
      <!-- Brand Logo / Identity Header -->
      <a href="../index.html" class="auth-brand" aria-label="IRONMAN TOSS BOOK - Return to Home">
        <div class="auth-brand-badge">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"></path>
          </svg>
        </div>
        <span class="auth-brand-title">IRONMAN</span>
        <span class="auth-brand-subtitle">TOSS BOOK</span>
      </a>

      <!-- Reset Password Card -->
      <main class="auth-card" id="reset-card">
        <header class="auth-card-header">
          <h1 class="auth-title">Reset Password</h1>
          <p class="auth-subtitle">Choose a new, strong password to secure your account.</p>
        </header>

        <!-- Token Notice -->
        <div id="token-status-notice" class="auth-alert auth-alert-dev" role="status" aria-live="polite"></div>

        <!-- Development Notice / Honest Boundary Banner -->
        <div id="reset-dev-alert" class="auth-alert auth-alert-dev" role="status" aria-live="polite"></div>

        <!-- Reset Form -->
        <form class="auth-form" id="reset-form" novalidate>
          
          <!-- New Password -->
          <div class="form-group">
            <label for="reset-password" class="form-label">New Password</label>
            <div class="input-wrapper">
              <input 
                type="password" 
                id="reset-password" 
                name="newPassword" 
                class="form-control" 
                placeholder="Minimum 12 characters"
                autocomplete="new-password"
                required
                aria-describedby="password-error password-policy"
              />
              <button 
                type="button" 
                id="password-toggle-btn" 
                class="password-toggle-btn" 
                title="Show password in plain text">
              </button>
            </div>

            <!-- Strength Meter -->
            <div class="password-strength-container" aria-live="polite">
              <div class="strength-bars" aria-hidden="true">
                <span class="strength-bar-segment"></span>
                <span class="strength-bar-segment"></span>
                <span class="strength-bar-segment"></span>
                <span class="strength-bar-segment"></span>
              </div>
              <div class="strength-label-row">
                <span class="field-hint" id="password-policy">Platform Policy: Minimum 12 characters</span>
                <span class="strength-text" id="strength-label">Enter a password</span>
              </div>
            </div>
            <div id="password-error" class="field-error" role="alert"></div>
          </div>

          <!-- Confirm New Password -->
          <div class="form-group">
            <label for="reset-confirm" class="form-label">Confirm New Password</label>
            <div class="input-wrapper">
              <input 
                type="password" 
                id="reset-confirm" 
                name="confirmPassword" 
                class="form-control" 
                placeholder="Re-enter your new password"
                autocomplete="new-password"
                required
                aria-describedby="confirm-error"
              />
              <button 
                type="button" 
                id="confirm-toggle-btn" 
                class="password-toggle-btn" 
                title="Show confirm password in plain text">
              </button>
            </div>
            <div id="confirm-error" class="field-error" role="alert"></div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary btn-block" id="reset-submit-btn" style="margin-top: var(--space-xs);">
            <span class="btn-spinner" aria-hidden="true"></span>
            <span class="btn-text">Update Password</span>
          </button>
        </form>

        <!-- Card Footer Links -->
        <footer class="auth-card-footer">
          <p>
            Already know your credentials? 
            <a href="login.html">Sign In</a>
          </p>
        </footer>
      </main>

      <!-- Return to Home Link -->
      <div class="auth-back-home">
        <a href="../index.html">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Back to Home
        </a>
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/auth/validation.js"></script>
  <script src="../js/auth/reset-password.js"></script>
</body>
</html>
